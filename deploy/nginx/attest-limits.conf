# Per-IP limits for attest.encedo.com (http context: /etc/nginx/conf.d/).
#
# POST runs openssl several times per request (JWT, certificate chain, CRLs),
# so it gets the tight budget; GET lookups are a single SQLite query.
# A key of "" is not counted, which is how the map keeps GETs out of the POST zone.
#
# Changing the key or the size of an existing zone needs `systemctl restart nginx`;
# a reload refuses it silently and keeps the old zone.
map $request_method $attest_post_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone  $attest_post_ip      zone=attest_post:10m rate=1r/s;
limit_req_zone  $binary_remote_addr  zone=attest_get:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=attest_conn:10m;
