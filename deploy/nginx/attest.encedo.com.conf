# attest.encedo.com - the attestation service (Docker, 127.0.0.1:8080) behind the host nginx.
# TLS, limits and logging policy live here; the container only answers HTTP on loopback.
server {
    listen 80;
    listen [::]:80;
    server_name attest.encedo.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name attest.encedo.com;

    ssl_certificate     /etc/letsencrypt/live/attest.encedo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attest.encedo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # the service refuses more than 24 KB itself (MAX_BODY); nginx only stops what is far larger,
    # and keeps an accepted body in memory
    client_max_body_size 32k;
    client_body_buffer_size 32k;

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn attest_conn 10;
    limit_req  zone=attest_post burst=10 nodelay;
    limit_req  zone=attest_get  burst=40 nodelay;

    # a SKID in the URL identifies a device: lookups are not logged
    location /v1/skid/ {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/attest-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/attest-proxy.conf;
    }
}
