# pki.encedo.com - static Encedo PKI (CA certs + CRLs)
server {
    listen 80;
    listen [::]:80;
    server_name pki.encedo.com;
    root /var/www/pki.encedo.com;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    # AIA / CRL fetchers often speak plain HTTP only
    location ~ ^/[a-z-]+\.(cer|crl)$ { include /etc/nginx/snippets/pki-types.conf; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pki.encedo.com;
    root /var/www/pki.encedo.com;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/pki.encedo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pki.encedo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location ~ ^/[a-z-]+\.(cer|crl|pem)$ {
        include /etc/nginx/snippets/pki-types.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location = /SHA256SUMS {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri $uri/ =404; }
}
