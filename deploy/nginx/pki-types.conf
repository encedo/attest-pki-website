types { application/pkix-cert cer; application/pkix-crl crl; application/x-x509-ca-cert pem; }
# add_header here replaces the server's add_header, so the ones that matter are repeated
add_header Cache-Control "public, max-age=3600" always;
add_header Access-Control-Allow-Origin "*" always;
add_header X-Content-Type-Options nosniff always;
try_files $uri =404;
